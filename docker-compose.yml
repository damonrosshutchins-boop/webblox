services:
  webblox:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Engine files from a GitHub repo built by .github/workflows/fetch-vendor.yml.
      # Remove to use a local vendor/ folder (node scripts/fetch-vendor.mjs).
      ENGINE_SOURCE: github:ytsodacan/webblox-files
      CDN_ONLY: "1"
